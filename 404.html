<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Celadon</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">

<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<meta name="theme-color" content="#131b11">
<link rel="preload" href="/src/assets/fonts/caprasimo-latin.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="/src/styles/fonts.css">
<link rel="stylesheet" href="/src/styles/base.css">

<body>
<a class="cel-skip-link" href="#main">Skip to content</a>
<div class="cel-page">

<nav class="cel-nav cel-container" aria-label="Primary">
  <a href="/" class="cel-brand">
    <img src="/brand/celadon-dark.svg" alt="" width="34" height="34" class="cel-brand-mark cel-brand-mark--dark">
    <img src="/brand/celadon-light.svg" alt="" width="34" height="34" class="cel-brand-mark cel-brand-mark--light">
    <span class="cel-brand-name">Celadon</span>
  </a>
  <div class="cel-navlinks">
    <a href="/" class="cel-navlink">Home</a>
    <a href="/palette" class="cel-navlink">Palette</a>
    <a href="/ports" class="cel-navlink">Ports</a>
    <a href="/wallpapers" class="cel-navlink">Wallpapers</a>
    <a href="/contribute" class="cel-navlink">Contribute</a>
  </div>
  <div class="cel-switch" role="group" aria-label="Theme variant">
    <button type="button" class="cel-vpill" data-variant-pick="celadon" aria-pressed="false" title="dark · medium contrast">Celadon</button>
    <button type="button" class="cel-vpill" data-variant-pick="celadon-powder" aria-pressed="false" title="dark · low contrast">Powder</button>

    <div class="cel-kicker" style="margin-bottom:16px">404 &middot; off the palette</div>

</main>

<footer class="cel-footer">
  <div class="cel-container cel-footer-bar">
    <span>MIT license &middot; named for the pale grey-green glaze</span>
    <span class="cel-footer-links">
      <a href="https://github.com/celadon-theme/celadon-theme" target="_blank" rel="noopener">GitHub</a>
      <a href="/contribute">Contribute</a>
    </span>
  </div>
  <div class="cel-container"><div class="cel-footer-mark" aria-hidden="true">Celadon</div></div>
</footer>

</div>
<script type="module" src="/src/main.js"></script>
