version: 2
updates:
  # npm dev dependencies (Vite, etc.) — one grouped PR per week to keep noise low.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  # Keep the GitHub Actions we pin (checkout, setup-node) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
