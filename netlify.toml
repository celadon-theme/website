# Netlify build + deploy config for the Celadon site.
# Vite compiles the multi-page static site into ./dist, which Netlify publishes.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Long-cache the fingerprinted assets Vite emits under /assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# celadon-theme.js is copied verbatim (not fingerprinted), so keep it fresh.
[[headers]]
  for = "/celadon-theme.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
