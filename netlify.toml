# Netlify build + deploy config for the Celadon site.
# Vite compiles the multi-page static site into ./dist, which Netlify publishes.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Clean URLs: pages link to /palette etc.; serve the built .html behind them.
[[redirects]]
  from = "/palette"
  to = "/palette.html"
  status = 200

[[redirects]]
  from = "/ports"
  to = "/ports.html"
  status = 200

[[redirects]]
  from = "/contribute"
  to = "/contribute.html"
  status = 200

# Long-cache the fingerprinted assets Vite emits under /assets. Static files
# from public/ (brand, photos, icons) live at other paths on purpose, so they
# can be replaced in place.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# celadon-theme.js is copied verbatim (not fingerprinted), so keep it fresh.
[[headers]]
  for = "/celadon-theme.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
